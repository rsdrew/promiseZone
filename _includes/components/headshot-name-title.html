<div class="headshot-name-title slide-right">
  <img
    class="headshot-name-title__headshot"
    src="{{ site.baseurl }}/assets/images/staff/{{ include.filename }}.webp"
    alt="{{ include.name }}"
  />
  <p class="headshot-name-title__name text-subheader">
    {{ include.name }}
  </p>
  <p class="headshot-name-title__title text-italic">
    {{ include.title }}
  </p>
</div>
