<div id="lightbox">

  <button id="prev-photo" class="button fs-xl" onclick="prevPhotoOnClick(event)">&lt;</button>
  <img id="lightbox-photo" />
  <button id="next-photo" class="button fs-xl" onclick="nextPhotoOnClick(event)">&gt;</button>
</div>
<div id="lightbox-overlay"></div>
