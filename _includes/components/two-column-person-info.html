<div class="two-column-person-info">
  <div class="two-column-person-info__person slide-right">
    <img
      class="two-column-person-info__person__img"
      src="{{ site.baseurl }}/assets/images/staff/{{ include.filename }}.webp"
      alt="{{ include.name }}"
    />
    <p class="two-column-person-info__person__name text-subheader">
      {{ include.name }}
    </p>
    <p class="two-column-person-info__person__title text-italic">
      {{ include.title }}
    </p>
  </div>
  <div class="two-column-person-info__person__text slide-left">
    <p>
      <span class="text-page-subheader--bold">{{ include.bold-text }}</span> {{
      include.text }}
    </p>
  </div>
</div>
